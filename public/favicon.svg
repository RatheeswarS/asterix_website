  </defs>

  <!-- High-contrast Badge Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3"/>

  <!-- Aerodynamic Car Silhouette / Roofline Wing Arch -->
