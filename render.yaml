# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: asterix-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm ci --omit=dev
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://asterix-website.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false

