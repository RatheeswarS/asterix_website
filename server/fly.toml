# Fly.io deployment config with persistent volume
# Launch with: fly launch (inside server/)
app = "asterix-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  DATA_DIR = "/data"
  UPLOADS_DIR = "/data/uploads"
  CORS_ORIGIN = "https://asterix-website.vercel.app,http://localhost:5173"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "asterix_data"
  destination = "/data"
